<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S05 力的合成 - 三选一</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a14; color:#ccc; font-family:system-ui; padding:20px; }
  h1 { text-align:center; color:#ff6b35; margin-bottom:8px; }
  .subtitle { text-align:center; color:#888; margin-bottom:30px; }
  .grid { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .col { flex:1; min-width:300px; max-width:380px; background:#111122; border-radius:12px; overflow:hidden; border:2px solid #1a1a3a; }
  .col:hover { border-color:#444; }
  .col-header { padding:12px; text-align:center; font-weight:bold; font-size:16px; border-bottom:1px solid #1a1a3a; }
  .col-header.a { color:#ff6b35; }
  .col-header.b { color:#ff2d95; }
  .col-header.c { color:#00d4ff; }
  .col img { width:100%; display:block; cursor:pointer; }
  .col-desc { padding:10px; font-size:13px; color:#888; text-align:center; }
  .btn-wrap { text-align:center; margin:10px 0 6px; }
  .btn { padding:8px 24px; border-radius:6px; border:none; font-size:14px; cursor:pointer; margin:0 6px; }
  .btn-pick { background:#2a5; color:#fff; }
  .btn-pick:hover { background:#3c6; }
  .btn-note { background:#555; color:#fff; }
  .btn-note:hover { background:#777; }
  .verdict { text-align:center; padding:12px; font-size:14px; color:#ff6b35; display:none; }
  .note-box { width:100%; min-height:60px; background:#0a0a14; border:1px solid #333; color:#ccc; padding:8px; font-size:13px; display:none; margin-top:4px; border-radius:4px; resize:vertical; }
</style>
</head>
<body>
<h1>S05 力的合成 — 推车方案 三选一</h1>
<p class="subtitle">三人同向推一辆战车 = 三个同向力合成一个合力（点击图片放大）</p>

<div class="grid">
  <!-- A: Side view, position specified -->
  <div class="col" id="colA">
    <div class="col-header a">A · 侧视定位版</div>
    <img src="art_samples/card_art/S05_v3_leftAll.png" onclick="pick('A')" title="点击选择">
    <div class="col-desc">侧视角：两人在战车左侧后方，方向明确标注</div>
    <div class="btn-wrap">
      <button class="btn btn-pick" onclick="pick('A')">选这个 ✅</button>
    </div>
  </div>

  <!-- B: Strictly behind -->
  <div class="col" id="colB">
    <div class="col-header b">B · 后方限制版</div>
    <img src="art_samples/card_art/S05_v3_behindOnly.png" onclick="pick('B')" title="点击选择">
    <div class="col-desc">侧视角：「严格在后方、不在侧面」，加否定描述</div>
    <div class="btn-wrap">
      <button class="btn btn-pick" onclick="pick('B')">选这个 ✅</button>
    </div>
  </div>

  <!-- C: Rear view bent -->
  <div class="col" id="colC">
    <div class="col-header c">C · 后方弯腰版 ⭐</div>
    <img src="art_samples/card_art/S05_v3_rearView_bent.png" onclick="pick('C')" title="点击选择">
    <div class="col-desc">背后视角：两人弯腰前倾，全力推车</div>
    <div class="btn-wrap">
      <button class="btn btn-pick" onclick="pick('C')">选这个 ✅</button>
    </div>
  </div>
</div>

<div class="verdict" id="verdict"></div>
<textarea class="note-box" id="noteBox" placeholder="备注…"></textarea>
<div class="btn-wrap" style="margin-top:20px;">
  <button class="btn btn-note" onclick="saveNote()">保存备注</button>
  <button class="btn btn-note" onclick="exportResult()">导出结果</button>
</div>

<script>
function pick(ver) {
  document.querySelectorAll('.col').forEach(c => c.style.borderColor = '#1a1a3a');
  document.getElementById('col'+ver).style.borderColor = '#ff6b35';
  document.getElementById('verdict').style.display = 'block';
  document.getElementById('verdict').textContent = '已选择版本 ' + ver;
  localStorage.setItem('S05_pick', ver);
}

function saveNote() {
  const note = document.getElementById('noteBox').value;
  localStorage.setItem('S05_note', note);
  if (note) document.getElementById('noteBox').style.display = 'block';
  alert('已保存');
}

function exportResult() {
  const pick = localStorage.getItem('S05_pick') || '未选择';
  const note = localStorage.getItem('S05_note') || '';
  alert('版本: ' + pick + '\n备注: ' + note);
}

// restore
const saved = localStorage.getItem('S05_pick');
const note = localStorage.getItem('S05_note');
if (saved) {
  document.getElementById('verdict').style.display = 'block';
  document.getElementById('verdict').textContent = '已选择版本 ' + saved;
  document.getElementById('col'+saved).style.borderColor = '#ff6b35';
}
if (note) {
  document.getElementById('noteBox').style.display = 'block';
  document.getElementById('noteBox').value = note;
}
</script>
</body>
</html>
