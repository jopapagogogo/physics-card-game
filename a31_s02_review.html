<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A31 / S02 补插画审核</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:'Segoe UI',sans-serif;padding:20px}
h1{text-align:center;color:#fff;margin-bottom:20px}
.grid{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.card{background:#161630;border-radius:12px;padding:16px;border:1px solid #2a2a4a;width:420px}
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cid{background:#333;color:#fff;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:bold}
.name{font-size:16px;font-weight:bold;color:#fff}
.domain{font-size:13px;font-weight:bold;color:#ff6600}
.image-container{height:400px;overflow:hidden;border-radius:8px;background:#000;cursor:pointer;margin-bottom:10px}
.image-container img{width:100%;height:100%;object-fit:cover}
.effect{color:#ccc;font-size:12px;line-height:1.6;background:#1a1a30;padding:10px;border-radius:6px;margin-bottom:10px}
.btns{display:flex;gap:8px}
.btns button{padding:6px 20px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold;flex:1}
.btn-accept{background:#4CAF50;color:white}
.btn-reject{background:#f44336;color:white}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;justify-content:center;align-items:center}
.modal.active{display:flex}
.modal img{max-width:90vw;max-height:90vh;object-fit:contain}
.modal .close{position:absolute;top:20px;right:30px;font-size:40px;color:white;cursor:pointer}
</style></head>
<body>
<h1>A31 共振爆破 / S02 能量蓄积 — 补插画审核</h1>
<div class="grid">
<div class="card" id="card-A31">
  <div class="card-header"><span class="cid">A31</span><span class="name">🔊 共振爆破</span><span class="domain">[声,力]</span></div>
  <div class="image-container" onclick="zoom('art_samples/card_art/A31_resonance_blast_2026-06-16.png')"><img src="art_samples/card_art/A31_resonance_blast_2026-06-16.png"></div>
  <div class="effect">造成50点伤害 + 对方场上每有一张卡额外造成55伤害。原理：共振是受迫振动达到固有频率时振幅最大的现象——对方场上卡越多=共振面越多=破坏力越强。</div>
  <div class="btns">
    <button class="btn-accept" onclick="accept('A31')">✅ 通过</button>
    <button class="btn-reject" onclick="reject('A31')">❌ 不通过</button>
  </div>
  <span id="status-A31"></span>
</div>
<div class="card" id="card-S02">
  <div class="card-header"><span class="cid">S02</span><span class="name">⚡ 能量蓄积</span><span class="domain">[力]</span></div>
  <div class="image-container" onclick="zoom('art_samples/card_art/S02_energy_charge_2026-06-16.png')"><img src="art_samples/card_art/S02_energy_charge_2026-06-16.png"></div>
  <div class="effect">己方下次力系攻击+18伤害。原理：运动的物体具有动能（Ek=1/2mv²），能量蓄积后释放更猛烈。</div>
  <div class="btns">
    <button class="btn-accept" onclick="accept('S02')">✅ 通过</button>
    <button class="btn-reject" onclick="reject('S02')">❌ 不通过</button>
  </div>
  <span id="status-S02"></span>
</div>
</div>
<div class="modal" id="zoom-modal" onclick="this.classList.remove('active')"><span class="close">&times;</span><img id="zoom-img"></div>
<script>
function zoom(src){document.getElementById('zoom-img').src=src;document.getElementById('zoom-modal').classList.add('active')}
function accept(cid){document.getElementById('status-'+cid).textContent='✅ 已通过';document.getElementById('status-'+cid).style.color='#4CAF50'}
function reject(cid){document.getElementById('status-'+cid).textContent='❌ 不通过';document.getElementById('status-'+cid).style.color='#f44336'}
</script>
</body>
</html>
