<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S05 三选一对比</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; color:#ccc; font-family:'Segoe UI',sans-serif; padding:20px; text-align:center; }
  h1 { color:#00e5ff; margin-bottom:8px; font-size:22px; }
  .subtitle { color:#ff8a80; margin-bottom:24px; font-size:13px; }
  .compare { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; max-width:1200px; margin:0 auto; }
  .variant { background:#111122; border:1px solid #222; border-radius:12px; overflow:hidden; width:360px; transition:all 0.2s; }
  .variant:hover { border-color:#00e5ff; }
  .variant h3 { padding:10px; background:#0d0d22; color:#ffab40; font-size:14px; }
  .variant img { width:100%; display:block; cursor:pointer; max-height:550px; object-fit:cover; }
  .variant .desc { padding:8px 12px; font-size:11px; color:#888; background:#0d0d22; }
  .variant .pick { display:block; width:100%; padding:10px; background:#1b5e20; color:#69f0ae; border:1px solid #4caf50; cursor:pointer; font-size:13px; }
  .variant .pick:hover { background:#2e7d32; }
  .variant .pick.svg { background:#333; color:#aaa; border-color:#555; }
  .variant .pick.svg:hover { background:#444; }
  .lightbox { display:none; position:fixed; top:0;left:0;width:100%;height:100%; background:rgba(0,0,0,0.94); z-index:9999; justify-content:center;align-items:center; }
  .lightbox img { max-width:90vw; max-height:90vh; border-radius:8px; }
  .lightbox.show { display:flex; }
</style>
</head>
<body>
<h1>S05 力的合成 · 三选一</h1>
<div class="subtitle">以SVG精确几何为参考，AI美化两个版本。挑一张最好的。</div>
<div class="compare">
  <div class="variant">
    <h3>参考图：SVG精确几何</h3>
    <img src="art_samples/card_art/S05_force_synthesis_v2_2026-06-16.svg" alt="SVG精确版" onclick="show(this.src)">
    <div class="desc">橙色F₁ 粉色F₂ 蓝色F · 严格共线同向 · 纯几何</div>
    <button class="pick svg" onclick="alert('已选参考图SVG，可继续用这个')">✅ 就用这个</button>
  </div>
  <div class="variant">
    <h3>版本A：宇宙星云风</h3>
    <img src="art_samples/card_art/S05_fusion_v3_A_cosmic.png" alt="宇宙星云版" onclick="show(this.src)">
    <div class="desc">AI美化 · 暗色星云背景 · 霓虹力矢量</div>
    <button class="pick" onclick="choose('A')">✅ 选版本A</button>
  </div>
  <div class="variant">
    <h3>版本B：粒子特效风</h3>
    <img src="art_samples/card_art/S05_fusion_v3_B_particles.png" alt="粒子特效版" onclick="show(this.src)">
    <div class="desc">AI美化 · 微粒子背景 · 霓虹力矢量</div>
    <button class="pick" onclick="choose('B')">✅ 选版本B</button>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')">
  <img id="lbImg" src="" alt="preview">
</div>
<script>
function show(src) { document.getElementById('lbImg').src=src; document.getElementById('lightbox').classList.add('show'); }
function choose(v) {
  const confirmMsg = '已选择版本' + v + '！\n文件: art_samples/card_art/S05_fusion_v3_' + (v==='A'?'A_cosmic':'B_particles') + '.png';
  navigator.clipboard.writeText(confirmMsg).then(() => alert(confirmMsg + '\n\n（已复制到剪贴板）'));
}
</script>
</body>
</html>
