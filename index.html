<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>物理卡牌对战</title>
  <link rel="stylesheet" href="css/game_v2.css">
  <style>
    html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
    html{height:-webkit-fill-available}
    body{min-height:100vh;min-height:-webkit-fill-available}
    #game-container{width:100%;height:100vh;height:100dvh;height:-webkit-fill-available;max-width:100%;margin:0;overflow:hidden;position:fixed;inset:0}
    .card-v3.mini{width:128px!important;height:183px!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;box-shadow:0 0 4px rgba(0,0,0,.3)!important}
    .card-v3.mini::before,.card-v3.mini::after{display:none!important}
    .card-v3.mini.skin-cyber{box-shadow:0 0 4px var(--dm-glow)!important}
    .card-v3.mini .v3-art-frame{flex:1 1 0!important;min-height:0!important}
    .card-v3.mini:hover{transform-origin:center center!important;transform:rotate(var(--rot)) scale(1.15) translateY(-8px)!important}
    @media(max-width:768px){
      #game-container .card-v3.mini{width:min(100px,28vw)!important;height:min(143px,40vw)!important}
      #game-container .card-v3.mini:hover{transform:rotate(var(--rot)) scale(1.08) translateY(-4px)!important}
    }
    @media(orientation:landscape) and (max-height:500px){
      #game-container .card-v3.mini{width:min(60px,12vw)!important;height:min(86px,20vw)!important}
      /* 释放空间给插画：隐藏描述、伤害数值、分割线 */
      #game-container .card-v3.mini .v3-desc-box{display:none!important}
      #game-container .card-v3.mini .v3-stats{display:none!important}
      #game-container .card-v3.mini .v3-divider{display:none!important}
      /* 详情弹窗缩小 */
      .card-zoom-overlay .card-v3{width:220px!important;max-height:95vh!important}
      .card-zoom-overlay .v3-art-frame{height:140px!important}
      .card-zoom-overlay .v3-desc-box{max-height:80px!important}
      /* 弃牌弹窗缩小 */
      .discard-card{max-width:320px!important;padding:14px!important}
      .discard-card h3{font-size:13px!important;margin-bottom:10px!important}
      .discard-choice{padding:6px 10px!important;font-size:11px!important}
    }
    /* 移动端禁止图片长按弹出菜单（穿透触摸+禁callout） */
    .card-v3 img,.card img{pointer-events:none;-webkit-touch-callout:none}
    .card-v3,.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    .card-hand{-webkit-touch-callout:none}
  </style>
  <script>
  var _hmt = _hmt || [];
  (function() {
    var hm = document.createElement("script");
    hm.src = "https://hm.baidu.com/hm.js?0a2d2f458f0916d67203808244d85a73";
    var s = document.getElementsByTagName("script")[0]; 
    s.parentNode.insertBefore(hm, s);
  })();
  </script>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="js/ui.js?v=72"></script>
</body>
</html>
