<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第9批卡牌插画审核</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px; }
h1 { text-align: center; font-size: 24px; margin-bottom: 8px; color: #00e5ff; }
.subtitle { text-align: center; color: #888; margin-bottom: 32px; font-size: 14px; }
.grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
.card-item { background: #111118; border: 2px solid #222; border-radius: 12px; padding: 16px; width: 320px; text-align: center; }
.card-id { font-size: 22px; font-weight: 700; color: #ff9100; margin-bottom: 4px; }
.card-name { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 12px; }
.card-img { width: 100%; border-radius: 8px; border: 1px solid #333; }
.card-status { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }
.btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
.btn-approve { background: #1b5e20; color: #69f0ae; }
.btn-approve:hover { background: #2e7d32; }
.btn-reject { background: #4a1a1a; color: #ff8a80; }
.btn-reject:hover { background: #621b1b; }
.btn-approve.active { background: #00c853; color: #000; box-shadow: 0 0 16px #00c853; }
.btn-reject.active { background: #ff1744; color: #fff; box-shadow: 0 0 16px #ff1744; }
.note { margin-top: 8px; font-size: 13px; color: #666; }
</style>
</head>
<body>
<h1>🔬 第9批卡牌插画审核</h1>
<p class="subtitle">9 张 · 点击按钮标记通过/不通过</p>
<div class="grid" id="grid"></div>

<script>
const cards = [
  { id: "A03", name: "压强穿刺", file: "A_spear_like_mechanical_spike__2026-06-15T08-04-27.png" },
  { id: "A04", name: "杠杆撬击", file: "A_small_child_standing_on_the__2026-06-15T08-04-28.png" },
  { id: "A06", name: "动能冲击", file: "A_giant_bullet_smashing_throug_2026-06-15T08-04-28.png" },
  { id: "S05", name: "力的合成", file: "Two_parallel_neon_force_vector_2026-06-15T08-04-27.png" },
  { id: "A14", name: "回声爆破", file: "Sound_waves_radiating_outward__2026-06-15T08-04-28.png" },
  { id: "S10", name: "共振蓄能", file: "A_glass_crystal_panel_being_dr_2026-06-15T08-05-33.png" },
  { id: "C09", name: "伽利略", file: "A_Renaissance_era_astronomer_w_2026-06-15T08-05-34.png" },
  { id: "C12", name: "赫兹", file: "A_19th_century_German_physicis_2026-06-15T08-05-33.png" },
  { id: "C14", name: "安培", file: "A_19th_century_French_physicis_2026-06-15T08-05-33.png" }
];

const grid = document.getElementById('grid');
cards.forEach((card, i) => {
  const div = document.createElement('div');
  div.className = 'card-item';
  div.innerHTML = `
    <div class="card-id">${card.id}</div>
    <div class="card-name">${card.name}</div>
    <img class="card-img" src="art_samples/card_art/${card.file}" onerror="this.style.border='2px solid red';this.alt='图片加载失败: ${card.file}'">
    <div class="card-status">
      <button class="btn btn-approve" onclick="toggle(this, 'approve', ${i})">✅ 通过</button>
      <button class="btn btn-reject" onclick="toggle(this, 'reject', ${i})">❌ 不通过</button>
    </div>
    <div class="note">提示词与理解：${getNote(card.id)}</div>
  `;
  grid.appendChild(div);
});

function toggle(btn, type, idx) {
  const btns = btn.parentElement.querySelectorAll('.btn');
  btns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const row = document.getElementById('grid').children[idx];
  if (type === 'approve') row.style.borderColor = '#00c853';
  else row.style.borderColor = '#ff1744';
}

function getNote(id) {
  const notes = {
    'A03': '枪尖从正面穿透墙壁，尖端从另一侧冒出',
    'A04': '小孩踩杠杆一端，重物被撬飞弹起',
    'A06': '巨大子弹正面撞碎墙壁，炸开大洞',
    'S05': '两根同向矢量箭头合并成一束更粗光束',
    'A14': '声波扩散反射，入射波与反射波叠加爆发',
    'S10': '玻璃晶体在声波共振下裂纹扩散，即将炸裂',
    'C09': '伽利略：自然面貌，暗色实验室+全息',
    'C12': '赫兹：自然面貌，暗色实验室+声波全息',
    'C14': '安培：自然面貌，暗色实验室+电流全息'
  };
  return notes[id] || '';
}
</script>
</body>
</html>
