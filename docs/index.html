<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>物理卡牌对战</title>
  <link rel="stylesheet" href="css/game_v2.css">
  <style>
    html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
    html{height:-webkit-fill-available}
    body{min-height:100vh;min-height:-webkit-fill-available}
    #game-container{width:100%;height:100vh;height:100dvh;height:-webkit-fill-available;max-width:100%;margin:0;overflow:hidden;position:fixed;inset:0}
    .card-v3.mini{width:128px!important;height:183px!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;box-shadow:0 0 4px rgba(0,0,0,.3)!important}
    .card-v3.mini::before,.card-v3.mini::after{display:none!important}
    .card-v3.mini.skin-cyber{box-shadow:0 0 4px var(--dm-glow)!important}
    .card-v3.mini .v3-art-frame{flex:1 1 0!important;min-height:0!important}
    .card-v3.mini:hover{transform-origin:center center!important;transform:rotate(var(--rot)) scale(1.15) translateY(-8px)!important}
    @media(max-width:768px){
      #game-container .card-v3.mini{width:min(100px,28vw)!important;height:min(143px,40vw)!important}
      #game-container .card-v3.mini:hover{transform:rotate(var(--rot)) scale(1.08) translateY(-4px)!important}
    }
    @media(orientation:landscape) and (max-height:500px){
      /* 横屏手牌卡：放大尺寸，让插画占据视觉重心 */
      #game-container .card-v3.mini{width:min(82px,15vw)!important;height:min(116px,26vw)!important}
      /* 压缩顶部信息区，让插画更突出 */
      #game-container .card-v3.mini .v3-header{padding:4px 6px 1px!important;gap:3px!important}
      #game-container .card-v3.mini .v3-cost{width:20px!important;height:20px!important;font-size:.7em!important}
      #game-container .card-v3.mini .v3-cost::before{inset:-1px!important;-webkit-mask:radial-gradient(circle,transparent 9px,#000 9.5px)!important;mask:radial-gradient(circle,transparent 9px,#000 9.5px)!important}
      #game-container .card-v3.mini .v3-name{font-size:.58em!important;letter-spacing:0!important;padding:0!important}
      #game-container .card-v3.mini .v3-rune{width:14px!important;height:14px!important}
      #game-container .card-v3.mini .v3-type-ribbon{padding:0 0 2px!important}
      #game-container .card-v3.mini .v3-type-pip{font-size:.5em!important;padding:0 4px!important}
      /* art-frame 已用 flex:1 自动撑满中部 */
      /* 隐藏描述、伤害数值、分割线 */
      #game-container .card-v3.mini .v3-desc-box{display:none!important}
      #game-container .card-v3.mini .v3-stats{display:none!important}
      #game-container .card-v3.mini .v3-divider{display:none!important}
      /* 横屏 hover 缩放更克制，避免溢出视野 */
      #game-container .card-v3.mini:hover{transform:rotate(var(--rot)) scale(1.1) translateY(-6px)!important}
      /* 详情弹窗：单屏完整显示 */
      .card-zoom-overlay .card-v3{width:200px!important;max-height:78vh!important;overflow:hidden!important}
      .card-zoom-overlay .v3-header{padding:8px 12px 2px!important;gap:6px!important}
      .card-zoom-overlay .v3-cost{width:32px!important;height:32px!important;font-size:1em!important}
      .card-zoom-overlay .v3-name{font-size:.85em!important;letter-spacing:1px!important}
      .card-zoom-overlay .v3-rune{width:22px!important;height:22px!important}
      .card-zoom-overlay .v3-type-ribbon{padding:0 0 4px!important}
      .card-zoom-overlay .v3-art-frame{height:96px!important;margin:0 8px!important}
      .card-zoom-overlay .v3-art-frame img{width:calc(100% - 4px)!important;height:calc(100% - 4px)!important}
      .card-zoom-overlay .v3-desc-box{max-height:56px!important;overflow-y:auto!important;font-size:.6em!important;line-height:1.3!important;margin:0 12px 6px!important;padding:4px 6px!important}
      .card-zoom-overlay .v3-stats{padding:0 12px 4px!important;min-height:20px!important;font-size:.7em!important}
      .card-zoom-overlay .v3-divider{padding:1px 12px!important}
      /* 弃牌弹窗缩小 */
      .discard-card{max-width:320px!important;padding:14px!important}
      .discard-card h3{font-size:13px!important;margin-bottom:10px!important}
      .discard-choice{padding:6px 10px!important;font-size:11px!important}
    }
    /* 移动端禁止图片长按弹出菜单（穿透触摸+禁callout） */
    .card-v3 img,.card img{pointer-events:none;-webkit-touch-callout:none}
    .card-v3,.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    .card-hand{-webkit-touch-callout:none}
  </style>
  <script>
  var _hmt = _hmt || [];
  (function() {
    var hm = document.createElement("script");
    hm.src = "https://hm.baidu.com/hm.js?0a2d2f458f0916d67203808244d85a73";
    var s = document.getElementsByTagName("script")[0]; 
    s.parentNode.insertBefore(hm, s);
  })();
  </script>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
