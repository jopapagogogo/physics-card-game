<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <defs>
    <radialGradient id="chaosGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Spiral vortex for chaos -->
  <circle cx="14" cy="14" r="12" fill="none" stroke="url(#chaosGrad)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="14" cy="14" r="9" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
  <circle cx="14" cy="14" r="6" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.7"/>
  <circle cx="14" cy="14" r="3" fill="#7c3aed" opacity="0.8"/>
  <!-- Swirling lines -->
  <path d="M14 2 Q18 8 18 14 Q18 20 14 26" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.6" filter="url(#glow)"/>
  <path d="M14 2 Q10 8 10 14 Q10 20 14 26" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.5"/>
  <!-- Small stars/dots -->
  <circle cx="8" cy="8" r="1" fill="#c084fc" opacity="0.7"/>
  <circle cx="20" cy="20" r="1" fill="#c084fc" opacity="0.7"/>
  <circle cx="18" cy="5" r="0.8" fill="#a855f7" opacity="0.5"/>
  <circle cx="6" cy="20" r="0.8" fill="#a855f7" opacity="0.5"/>
</svg>
